[package]
name = "rusthash-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = [
    ".",
    "cli",
]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
blake3 = "1.4"
md-5 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"
md4 = "0.10"
md2 = "0.10"
whirlpool = "0.10"
sm3 = "0.4"
crc32fast = "1.3"
adler = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh32"] }
siphasher = "1.0"
sha1 = "0.10"
hex = "0.4.3"

# Required for WebAssembly support in pure-Rust cryptographic crates
getrandom = { version = "0.2", features = ["js"] }

# New dependencies added for unimplemented/expanded algorithms
sp800-185 = "0.2"
argon2 = { version = "0.5", features = ["alloc", "password-hash"] }
bcrypt = "0.15"
scrypt = { version = "0.11", features = ["simple"] }
pbkdf2 = "0.12"
geohash = "0.13"
ascon-hash = "0.2"
fletcher = "0.2"
crc = "3.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
