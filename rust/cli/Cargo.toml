[package]
name = "rusthash-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
rusthash-core = { path = ".." }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
crossterm = "0.27"
ureq = { version = "2.9", features = ["json"] }

[dev-dependencies]
tempfile = "3.8"
