name: Release RustHash CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: rusthash.exe
            package_name: rusthash-x86_64-pc-windows-msvc.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: rusthash-cli
            package_name: rusthash-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: rusthash-cli
            package_name: rusthash-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: rusthash-cli
            package_name: rusthash-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: rusthash-cli
            package_name: rusthash-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary (standard)
        if: ${{ !matrix.use_cross }}
        run: cargo build --manifest-path rust/Cargo.toml --release -p rusthash-cli --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: ${{ matrix.use_cross }}
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: --manifest-path rust/Cargo.toml --release -p rusthash-cli

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binPath = "rust/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          # Copy to final name
          Copy-Item $binPath "rusthash.exe"
          Compress-Archive -Path "rusthash.exe" -DestinationPath "${{ matrix.package_name }}"
          $hash = (Get-FileHash -Path "${{ matrix.package_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.package_name }}" | Out-File -FilePath "${{ matrix.package_name }}.sha256" -Encoding ascii

      - name: Package Unix
        if: matrix.os != 'windows-latest'
        run: |
          bin_path="rust/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            bin_path="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          fi
          # Copy to final name
          cp "$bin_path" "rusthash"
          tar -czf "${{ matrix.package_name }}" rusthash
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.package_name }}" > "${{ matrix.package_name }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.package_name }}" > "${{ matrix.package_name }}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.package_name }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts structure
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Generate Checksums file
        run: |
          cd release-files
          rm -f checksums.txt
          for f in *.sha256; do
            cat "$f" >> checksums.txt
          done
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
