[package]
name = "hash_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
blake3 = "1.4"
md-5 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"
md4 = "0.10"
md2 = "0.10"
whirlpool = "0.10"
sm3 = "0.4"
crc32fast = "1.3"
adler = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh32"] }
siphasher = "1.0"
sha1 = "0.10"
gost94 = "0.11"
streebog = "0.11"
ascon-hash = "0.4"
jh = "0.2"
groestl = "0.11"
skein = "0.2"

[dev-dependencies]
hex = "0.4.3"
wasm-bindgen-test = "0.3"
